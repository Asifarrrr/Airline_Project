<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airline Satisfaction Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0e0919;--panel:#191030;--panel2:#241848;--line:#3a2c63;--text:#f0ebff;--mute:#a99dcc;--v:#8b5cf6;--v2:#c084fc;--ok:#2dd4bf;--bad:#fb7185}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;background:
 radial-gradient(900px 520px at 90% -10%,#7c3aed40,transparent 60%),
 radial-gradient(700px 520px at 0% 100%,#c026d322,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:#120b24cc;backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--v),var(--v2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 20px #8b5cf655}
aside h3{font-size:18px}
aside p{color:var(--mute);margin:0 0 28px;font-size:13px}
.fgroup{margin-bottom:28px}
.fgroup>label{display:block;font-weight:600;margin-bottom:12px}
.range-vals{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:600;color:var(--v2)}
.dual{position:relative;height:28px}
.track{position:absolute;top:12px;left:10px;right:10px;height:4px;background:var(--line);border-radius:4px}
.fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--v),var(--v2));border-radius:4px}
.dual input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:20px;height:20px;border-radius:50%;background:var(--v2);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--v2),0 4px 12px #0009;cursor:grab}
.dual input::-moz-range-thumb{pointer-events:all;width:14px;height:14px;border-radius:50%;background:var(--v2);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--v2);cursor:grab}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);padding:7px 15px;border-radius:999px;cursor:pointer;font:inherit;transition:.18s}
.chip:hover{border-color:var(--v2);color:var(--text)}
.chip.on{background:linear-gradient(135deg,var(--v),var(--v2));border-color:transparent;color:#fff;font-weight:600}
:is(.chip,button,input,select,summary):focus-visible{outline:2px solid var(--v2);outline-offset:2px}
main{padding:32px 38px 60px;max-width:1340px;width:100%}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
header h1{font-size:34px;line-height:1.15;letter-spacing:-.01em}
header p{margin:8px 0 0;color:var(--mute)}
.status{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:8px 15px;border-radius:999px;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status.ok .dot{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2dd4bfaa}70%{box-shadow:0 0 0 8px #2dd4bf00}100%{box-shadow:0 0 0 0 #2dd4bf00}}
.card{background:linear-gradient(180deg,#1d1238,var(--panel));border:1px solid var(--line);border-radius:18px;padding:22px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#5b44a0;box-shadow:0 10px 40px #0006}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--v))}
.kpi span{color:var(--mute);font-size:13px}
.kpi b{display:block;font:700 30px Sora,sans-serif;margin-top:4px}
.row{display:grid;gap:20px;margin-bottom:22px}
.card h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:13px}
.sec{font:600 14px "Plus Jakarta Sans";color:var(--v2);margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.field input,.field select{width:100%;background:#0e0919;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font:inherit;transition:border-color .15s}
.field input:hover,.field select:hover{border-color:#5b44a0}
.rates{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 22px}
.rate span{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:#0e0919;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mute);padding:7px 0;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.seg button:hover{color:var(--text);background:#ffffff0d}
.seg button.on{background:linear-gradient(135deg,var(--v),var(--v2));color:#fff}
button.primary{margin-top:22px;width:100%;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;border:0;border-radius:12px;padding:14px;font:600 15px "Plus Jakarta Sans";cursor:pointer;transition:transform .15s,box-shadow .15s}
button.primary:hover{transform:translateY(-1px);box-shadow:0 8px 28px #8b5cf655}
button.primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.ticket{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-style:dashed;background:radial-gradient(circle at 50% 0%,var(--panel2),var(--panel));position:sticky;top:24px;align-self:start;padding:34px 22px}
.ring{position:relative;width:210px;height:210px;margin:6px 0 14px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke-dasharray:502;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:700 40px Sora,sans-serif}
.verdict{font:700 22px Sora,sans-serif}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.hint{color:var(--mute);font-size:13px;max-width:240px;margin:6px 0 0}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.cwrap{position:relative;height:320px}
details.card summary{cursor:pointer;font:600 20px Sora,sans-serif}
.tbl{overflow:auto;max-height:380px;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:#ffffff08}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.y{background:#2dd4bf22;color:var(--ok)}.pill.n{background:#fb718522;color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:40px}
@media(max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr!important}.ticket{position:static}main{padding:24px 18px}}
@media(max-width:560px){.form,.form3,.rates{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const API = 'http://127.0.0.1:8000';
const COL = {ok:'#2dd4bf', bad:'#fb7185', v:'#8b5cf6', v2:'#c084fc', pink:'#e879f9', blue:'#6366f1', mute:'#a99dcc', line:'#3a2c63'};
Chart.defaults.color = COL.mute;
Chart.defaults.font.family = '"Plus Jakarta Sans", system-ui, sans-serif';

const RATINGS = [
  ['Inflight_wifi_service','Inflight Wi-Fi'], ['Departure_Arrival_time_convenient','Departure/arrival time'],
  ['Gate_location','Gate location'], ['Food_and_drink','Food & drink'], ['Online_boarding','Online boarding'],
  ['Seat_comfort','Seat comfort'], ['Inflight_entertainment','Entertainment'], ['On_board_service','On-board service'],
  ['Leg_room_service','Leg room'], ['Baggage_handling','Baggage handling'], ['Checkin_service','Check-in service'],
  ['Inflight_service','Inflight service'], ['Cleanliness','Cleanliness']
];
const CLASSES = ['Business', 'Eco', 'Eco Plus'];
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
const isSat = r => r.satisfaction == 1;
const classOf = r => r.Class_business == 1 ? 'Business' : r.Class_eco == 1 ? 'Eco' : 'Eco Plus';
const genderOf = r => r.Gender == 1 ? 'Male' : 'Female';
const distRange = rows => {
  let lo = Infinity, hi = -Infinity;
  for (const r of rows) { const v = r.Flight_Distance; if (v < lo) lo = v; if (v > hi) hi = v; }
  return [Math.floor(lo / 10) * 10, Math.ceil(hi / 10) * 10];
};
const MAX_POINTS = 5000;

/* ---------- Small components ---------- */
function Chips({ values, active, onToggle }) {
  return (
    <div className="chips">
      {values.map(v => <button key={v} className={'chip' + (active.includes(v) ? ' on' : '')} onClick={() => onToggle(v)}>{v}</button>)}
    </div>
  );
}

function DualSlider({ lo, hi, step, value: [a, b], onChange }) {
  const pct = v => hi === lo ? 0 : (v - lo) / (hi - lo) * 100;
  return (
    <div className="dual">
      <div className="track"><div className="fill" style={{ left: pct(a) + '%', width: (pct(b) - pct(a)) + '%' }} /></div>
      <input type="range" min={lo} max={hi} step={step} value={a} aria-label="Minimum flight distance"
        style={{ zIndex: a > hi - (hi - lo) * 0.1 ? 3 : 1 }} onChange={e => onChange([Math.min(+e.target.value, b), b])} />
      <input type="range" min={lo} max={hi} step={step} value={b} aria-label="Maximum flight distance"
        style={{ zIndex: 2 }} onChange={e => onChange([a, Math.max(+e.target.value, a)])} />
    </div>
  );
}

function useCountUp(target, decimals = 0) {
  const [v, setV] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setV(target); return; }
    const from = prev.current, t0 = performance.now(), dur = 700;
    let id;
    const tick = now => {
      const p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      setV(from + (target - from) * e);
      if (p < 1) id = requestAnimationFrame(tick); else prev.current = target;
    };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [target]);
  return v.toFixed(decimals);
}

function Kpi({ label, value, decimals = 0, suffix = '', accent, empty }) {
  const shown = useCountUp(value, decimals);
  return (
    <div className="card kpi" style={{ '--accent': accent }}>
      <span>{label}</span>
      <b>{empty ? '–' : Number(shown).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix}</b>
    </div>
  );
}

function ChartBox({ type, data, options, height }) {
  const ref = useRef(), chart = useRef();
  useEffect(() => {
    chart.current = new Chart(ref.current, { type, data, options });
    return () => chart.current.destroy();
  }, []);
  useEffect(() => {
    if (!chart.current) return;
    chart.current.data = data;
    chart.current.update();
  }, [data]);
  return <div className="cwrap" style={height ? { height } : null}><canvas ref={ref} /></div>;
}

function Rating({ label, value, onChange }) {
  return (
    <div className="rate">
      <span>{label}</span>
      <div className="seg" role="group" aria-label={label}>
        {[1, 2, 3, 4, 5].map(n => <button key={n} className={n === value ? 'on' : ''} aria-pressed={n === value} onClick={() => onChange(n)}>{n}</button>)}
      </div>
    </div>
  );
}

/* ---------- Prediction ---------- */
function Predictor() {
  const init = { Age: 35, Gender: 'Female', Class: 'Business', Customer: 'Loyal Customer', Travel: 'Business Travel',
                 Distance: 1000, DepDelay: 0, ArrDelay: 0 };
  RATINGS.forEach(([k]) => init[k] = 3);
  const [f, setF] = useState(init);
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const sel = k => e => set(k, e.target.value);
  const one = (a, b) => a === b ? 1 : 0;

  async function predict() {
    if (['Age', 'Distance', 'DepDelay', 'ArrDelay'].some(k => f[k] === '' || isNaN(+f[k]))) {
      setErr('Please fill in age, flight distance and both delays.'); return;
    }
    const payload = {
      Gender: one(f.Gender, 'Male'),
      Customer_Type: one(f.Customer, 'Loyal Customer'),
      Age: +f.Age,
      Type_of_Travel: one(f.Travel, 'Business Travel'),
      Flight_Distance: +f.Distance,
      Departure_Delay_in_Minutes: +f.DepDelay,
      Arrival_Delay_in_Minutes: +f.ArrDelay,
      Class_business: one(f.Class, 'Business'), Class_eco: one(f.Class, 'Eco'), Class_eco_plus: one(f.Class, 'Eco Plus')
    };
    RATINGS.forEach(([k]) => payload[k] = f[k]);
    setLoading(true); setErr('');
    try {
      const r = await fetch(API + '/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      setRes({ ok: j.Prediction === 1, p: j.Probability });
    } catch (e) {
      setErr('Could not get a prediction. Check that the FastAPI server is running on port 8000.');
    }
    setLoading(false);
  }

  const pct = res ? Math.round(res.p * 1000) / 10 : null;
  return (
    <div className="row" style={{ gridTemplateColumns: '1.5fr .7fr' }}>
      <div className="card">
        <h2>Customer features</h2>
        <p className="sub">Fill in the customer profile, the flight details and rate each service from 1 to 5.</p>
        <div className="form">
          <div className="field"><label>Age</label><input type="number" min="7" max="85" value={f.Age} onChange={sel('Age')} /></div>
          <div className="field"><label>Gender</label><select value={f.Gender} onChange={sel('Gender')}><option>Male</option><option>Female</option></select></div>
          <div className="field"><label>Class</label><select value={f.Class} onChange={sel('Class')}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></div>
          <div className="field"><label>Customer type</label><select value={f.Customer} onChange={sel('Customer')}><option>Loyal Customer</option><option>Disloyal Customer</option></select></div>
          <div className="field" style={{ gridColumn: '1 / -1' }}><label>Type of travel</label><select value={f.Travel} onChange={sel('Travel')}><option>Business Travel</option><option>Personal Travel</option></select></div>
        </div>
        <div className="sec">Flight details</div>
        <div className="form3">
          <div className="field"><label>Flight distance</label><input type="number" min="0" value={f.Distance} onChange={sel('Distance')} /></div>
          <div className="field"><label>Departure delay (min)</label><input type="number" min="0" value={f.DepDelay} onChange={sel('DepDelay')} /></div>
          <div className="field"><label>Arrival delay (min)</label><input type="number" min="0" value={f.ArrDelay} onChange={sel('ArrDelay')} /></div>
        </div>
        <div className="sec">Service ratings</div>
        <div className="rates">
          {RATINGS.map(([k, label]) => <Rating key={k} label={label} value={f[k]} onChange={v => set(k, v)} />)}
        </div>
        <button className="primary" onClick={predict} disabled={loading}>{loading ? 'Predicting…' : 'Predict satisfaction'}</button>
        {err && <div className="err" role="alert">{err}</div>}
      </div>

      <div className="card ticket">
        <div className="ring">
          <svg viewBox="0 0 180 180">
            <circle className="bg" cx="90" cy="90" r="80" />
            <circle className="fg" cx="90" cy="90" r="80" style={{ stroke: res ? (res.ok ? COL.ok : COL.bad) : COL.line, strokeDashoffset: 502 * (1 - (res ? res.p : 0)) }} />
          </svg>
          <div className="pct">{res ? pct + '%' : '–'}</div>
        </div>
        <div className={'verdict ' + (res ? (res.ok ? 'ok' : 'bad') : '')}>{res ? (res.ok ? 'Satisfied' : 'Not satisfied') : 'No prediction yet'}</div>
        <p className="hint">{res ? `Model probability is ${pct}%.` : 'Fill in the customer details and press Predict satisfaction.'}</p>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [rows, setRows] = useState([]);
  const [online, setOnline] = useState(null);
  const [dist, setDist] = useState([0, 0]);
  const [classes, setClasses] = useState(CLASSES);

  useEffect(() => {
    fetch(API + '/data').then(r => r.json()).then(list => {
      const data = list.map(r => ({ ...r, Class: classOf(r) }));
      setRows(data); setOnline(true);
      setDist(distRange(data));
    }).catch(() => setOnline(false));
  }, []);

  const bounds = useMemo(() => {
    if (!rows.length) return [0, 10];
    return distRange(rows);
  }, [rows]);

  const d = useMemo(() => rows.filter(r =>
    r.Flight_Distance >= dist[0] && r.Flight_Distance <= dist[1] && classes.includes(r.Class)
  ), [rows, dist, classes]);

  const n = d.length;
  const avg = k => { const v = d.filter(r => r[k] != null); return v.length ? v.reduce((s, r) => s + r[k], 0) / v.length : 0; };
  const satRate = n ? d.filter(isSat).length / n * 100 : 0;

  const scatterData = useMemo(() => {
    const pt = r => ({ x: r.Flight_Distance, y: r.Arrival_Delay_in_Minutes, g: genderOf(r), age: r.Age, t: r.Type_of_Travel == 1 ? 'Business travel' : 'Personal travel' });
    let ok = d.filter(r => r.Arrival_Delay_in_Minutes != null);
    const step = Math.ceil(ok.length / MAX_POINTS);
    if (step > 1) ok = ok.filter((_, i) => i % step === 0);
    return { datasets: [
      { label: 'Satisfied', data: ok.filter(isSat).map(pt), backgroundColor: COL.ok + 'aa', pointRadius: 3.5, pointHoverRadius: 7 },
      { label: 'Neutral or dissatisfied', data: ok.filter(r => !isSat(r)).map(pt), backgroundColor: COL.bad + 'aa', pointRadius: 3.5, pointHoverRadius: 7 }
    ]};
  }, [d]);

  const pieData = useMemo(() => {
    const sat = d.filter(isSat);
    return { labels: CLASSES, datasets: [{ data: CLASSES.map(c => sat.filter(r => r.Class === c).length), backgroundColor: [COL.v, COL.pink, COL.blue], borderColor: '#191030', borderWidth: 3 }] };
  }, [d]);

  const barData = useMemo(() => {
    const g = ['Female', 'Male'];
    const count = (x, s) => d.filter(r => genderOf(r) === x && isSat(r) === s).length;
    return { labels: g, datasets: [
      { label: 'Satisfied', data: g.map(x => count(x, true)), backgroundColor: COL.ok, borderRadius: 8, maxBarThickness: 70 },
      { label: 'Neutral or dissatisfied', data: g.map(x => count(x, false)), backgroundColor: COL.bad, borderRadius: 8, maxBarThickness: 70 }
    ]};
  }, [d]);

  const grid = { color: COL.line + '88' };
  const legend = { position: 'bottom', labels: { usePointStyle: true } };
  const scatterOpts = { maintainAspectRatio: false, animation: false,
    scales: { x: { title: { display: true, text: 'Flight distance' }, grid }, y: { title: { display: true, text: 'Arrival delay (min)' }, grid } },
    plugins: { legend, tooltip: { callbacks: { label: c => `${c.raw.x} mi, ${c.raw.y} min delay · ${c.raw.g}, ${c.raw.age} · ${c.raw.t}` } } } };
  const pieOpts = { maintainAspectRatio: false, cutout: '64%', plugins: { legend } };
  const barOpts = { maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { grid } }, plugins: { legend } };

  return (
    <div className="app">
      <aside>
        <div className="brand"><div className="logo">✈</div><h3>Filters</h3></div>
        <p>Narrow the customers shown in the charts.</p>
        <div className="fgroup">
          <label>Flight distance</label>
          <div className="range-vals"><span>{dist[0]}</span><span>{dist[1]}</span></div>
          <DualSlider lo={bounds[0]} hi={bounds[1]} step={10} value={dist} onChange={setDist} />
        </div>
        <div className="fgroup"><label>Class</label><Chips values={CLASSES} active={classes} onToggle={v => setClasses(toggle(classes, v))} /></div>
      </aside>

      <main>
        <header>
          <div>
            <h1>Airline Customer Satisfaction</h1>
            <p>A logistic regression model that predicts whether a passenger will be satisfied.{rows.length > 0 && ` Charts show ${rows.length.toLocaleString()} customers.`}</p>
          </div>
          <div className={'status' + (online ? ' ok' : '')}>
            <span className="dot" />
            {online === null ? 'Connecting to API…' : online ? 'API connected' : 'API offline. Start FastAPI on port 8000'}
          </div>
        </header>

        <section className="kpis">
          <Kpi label="Customers shown" value={n} empty={!rows.length} accent={COL.v} />
          <Kpi label="Satisfaction rate" value={satRate} decimals={1} suffix="%" empty={!n} accent={COL.ok} />
          <Kpi label="Average age" value={avg('Age')} decimals={1} empty={!n} accent={COL.pink} />
          <Kpi label="Avg arrival delay" value={avg('Arrival_Delay_in_Minutes')} decimals={1} suffix=" min" empty={!n} accent={COL.bad} />
        </section>

        <Predictor />

        {rows.length > 0 && n === 0 && <div className="card empty row">No customers match these filters. Widen the distance range or select more classes.</div>}

        {rows.length > 0 && <>
          <section className="row" style={{ gridTemplateColumns: '1.3fr .7fr' }}>
            <div className="card"><h2>Flight distance vs arrival delay</h2><p className="sub">Each dot is a customer, colored by satisfaction.{n > MAX_POINTS && ` To stay fast, ${MAX_POINTS.toLocaleString()} evenly spaced customers are drawn.`}</p><ChartBox type="scatter" data={scatterData} options={scatterOpts} /></div>
            <div className="card"><h2>Satisfied customers by class</h2><p className="sub">Share of satisfied customers in each class.</p><ChartBox type="doughnut" data={pieData} options={pieOpts} /></div>
          </section>
          <section className="card row">
            <div><h2>Male vs female satisfaction</h2><p className="sub">Number of customers in each satisfaction group.</p><ChartBox type="bar" data={barData} options={barOpts} height={260} /></div>
          </section>
          <details className="card">
            <summary>First 200 rows of the dataset</summary>
            <div className="tbl"><table>
              <thead><tr>{['Satisfaction', 'Gender', 'Age', 'Class', 'Type of travel', 'Distance', 'Dep. delay', 'Arr. delay'].map(c => <th key={c}>{c}</th>)}</tr></thead>
              <tbody>{rows.slice(0, 200).map((r, i) => (
                <tr key={i}>
                  <td><span className={'pill ' + (isSat(r) ? 'y' : 'n')}>{isSat(r) ? 'Satisfied' : 'Not satisfied'}</span></td>
                  <td>{genderOf(r)}</td><td>{r.Age}</td><td>{r.Class}</td><td>{r.Type_of_Travel == 1 ? 'Business' : 'Personal'}</td>
                  <td>{r.Flight_Distance}</td><td>{r.Departure_Delay_in_Minutes}</td><td>{r.Arrival_Delay_in_Minutes}</td>
                </tr>))}
              </tbody>
            </table></div>
          </details>
        </>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
